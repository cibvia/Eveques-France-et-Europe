name: Mise à jour automatique des diocèses

on:
  schedule:
    # Tous les lundis à 5h du matin (UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
    # Permet de déclencher la mise à jour manuellement depuis l'onglet
    # "Actions" du dépôt GitHub, y compris depuis un téléphone.

permissions:
  contents: write

jobs:
  update-dioceses:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Lancer le scraping (catholic-hierarchy.org)
        run: npm run update-dioceses

      - name: Committer les changements si nécessaire
        run: |
          git config user.name "eveques-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data/dioceses.json; then
            echo "Aucun changement, rien à committer."
          else
            git add data/dioceses.json
            git commit -m "Mise à jour automatique des diocèses ($(date -u +%Y-%m-%d))"
            git push
          fi
